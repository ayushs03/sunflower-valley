<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sunflower Valley</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b3a1a;font-family:Georgia,serif;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;top:14px;left:16px;color:#fff8d6;text-shadow:0 2px 6px #0007;font-size:20px;pointer-events:none}
  #hud small{display:block;font-size:13px;opacity:.85;margin-top:4px}
  #toast{position:fixed;top:18%;left:50%;transform:translateX(-50%);color:#fff;font-size:26px;text-shadow:0 2px 8px #000a;opacity:0;transition:opacity .6s;pointer-events:none;text-align:center}
  #missions{position:fixed;top:14px;right:16px;width:250px;background:#2b1a0e99;color:#fff8d6;border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.7;backdrop-filter:blur(4px);pointer-events:none}
  #missions b{font-size:15px;display:block;margin-bottom:2px}
  #missions .done{opacity:.6;text-decoration:line-through}
  #letter{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:9}
  #letter div{max-width:440px;margin:20px;background:#fff6dc;color:#4a2a12;padding:34px 38px;border-radius:10px;font-size:19px;line-height:1.7;box-shadow:0 10px 50px #000;white-space:pre-wrap}
  #letter button{margin-top:18px;font:inherit;padding:8px 22px;border-radius:20px;border:0;background:#d8191f;color:#fff;cursor:pointer}
  #pick{position:fixed;right:20px;bottom:24px;width:78px;height:78px;border-radius:50%;border:3px solid #fff8;background:#f7c52888;font-size:34px;color:#fff}
  #mpbtn{position:fixed;left:16px;bottom:24px;font:inherit;font-size:15px;padding:9px 16px;border-radius:22px;border:2px solid #fff8;background:#2b1a0eaa;color:#fff8d6;cursor:pointer}
  #mp{position:fixed;left:16px;bottom:74px;width:270px;background:#2b1a0ee6;color:#fff8d6;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;display:none}
  #mp button,#mp input{font:inherit;font-size:14px;border-radius:8px;border:0;padding:6px 10px;margin:3px 2px 0 0}
  #mp button{background:#f7c528;color:#3a2410;cursor:pointer}
  #mp input{width:84px;text-transform:uppercase;letter-spacing:2px;text-align:center}
  #mp .code{font-size:22px;letter-spacing:4px;font-weight:bold}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">💐 <span id="n">0</span> in your bouquet<small>Move: WASD / arrows / hold mouse · Pick: E or Space · Sun time: T</small></div>
<div id="toast"></div>
<div id="missions"></div>
<div id="letter"><div><span id="lt"></span><br><button id="lt-close">Close 🌻</button></div></div>
<button id="pick">🌻</button>
<button id="mpbtn">👫 Play together</button>
<div id="mp">
  <b>Play together</b>
  <div id="mpstatus">Playing solo. Invite a friend to explore the valley with you.</div>
  <div id="mpact"><button id="mphostg">Create room (👧 girl)</button><br><button id="mphostb">Create room (👦 boy)</button><br><input id="mpcode" maxlength="6" placeholder="CODE" autocomplete="off" spellcheck="false"><button id="mpjoin">Join</button></div>
  <div id="mpshare" style="display:none">Room code: <span class="code" id="mpc"></span><br><button id="mpcopy">Copy invite link</button></div>
</div>
<script src="peerjs.min.js"></script>
<script src="game.js"></script>
<script src="net.js"></script>
</body>
</html>
